agents:
  n_agents: 5
  role_to_feature:
    HumanEval: 1
    MATH: 3
    MMLU: 0
  roles:
  - manager
  - search_agent
  - text_inspector
  - visual_qa
  - reformulator
architecture: gaia_smolagents
bounds:
  lower: 0.0
  upper: 1.0
data:
  input_file: data/llm_data_lfm_smoke.csv
device:
  dtype: double
  use_cuda: false
evaluation:
  architecture: gaia_smolagents
experiment:
  description: Bayesian Optimization for LLM selection using qLogEHVI
  name: BoTorch_Multi_Objective_LLM
  version: '1.0'
features:
- MMLU
- HumanEval
- GSM8K
- Costo_Input_1M
- Costo_Output_1M
model:
  mc_samples: 64
  num_restarts: 4
  raw_samples: 128
optimization:
  batch_size: 1
  n_initial: 1
  n_iterations: 1
output:
  checkpoint_frequency: 1
  save_checkpoints: true
reference_point:
  cost: 1.1
  performance: -0.1
