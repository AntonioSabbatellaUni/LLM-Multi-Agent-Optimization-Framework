# Main config: GAIA / OpenCode Go pool 2026-11-13, 3 slots. Run (inside the container, cwd = malbo/):
#   python run_multi_agent_optimization.py --config config.go3slots.yaml
experiment:
  name: BoTorch_Go3slots
  description: BO of LLM roles on GAIA n30, allowance-aware Go pool 2026-11-14 (x4 models only medium/low/cheap)
  version: '1.0'
evaluation:
  architecture: gaia_smolagents
  architecture_config: multi_agent_architectures/gaia_smolagents/config.go3slots.yaml
data:
  input_file: data/llm_data_go_2026-11-14.csv
# Feature list is fully config-driven (dimension d = n_slots x len(features)). Min-max normalised per column.
# log_AA_CostPerTask is a cost-like feature but is NOT inverted (inversion only applies to columns named 'Costo*').
# Candidate 5th feature: AA_Blended_1M (column already in the CSV) - add it here to use it.
features:
  - AutomationBench
  - TerminalBench40
  - HLE
  - FrontierCode20
  - log_AA_CostPerTask
bounds:
  lower: 0.0
  upper: 1.0
device:
  dtype: double
  use_cuda: false
model:
  mc_samples: 64
  num_restarts: 4
  raw_samples: 128
optimization:
  batch_size: 1
  # n_initial omitted -> d+1 (3 slots x 5 features + 1 = 16). Set an integer to override.
  n_iterations: 0          # initial design only for now
  seed: 42                 # numpy/torch/initial-design seed (reproducible)
  # Reuse earlier evaluations as initial points (count toward n_initial; the balanced draw fills the rest without duplicating them).
  # warm_start_from: path (or list) to an output dir / evaluations.jsonl whose results are reused; include_configs: which configs
  # ({slot: option name}); if only warm_start_from is given, every valid evaluation in it is reused. An included config with no earlier result is evaluated.
  include_configs:
    - {manager: deepseek-v4.1-flash@max, search_agent: gpt-6-luna@low, docs: glm-5.3-flash@max}
  warm_start_from: outputs/go3_check30_p20   # 30-question evaluation of that config (60.0%, aa $2.4127)
  initial_design: balanced # balanced = per-slot seeded permutation of the pool, cycled (every option as evenly as possible); random = old iid draws
output:
  checkpoint_frequency: 1
  save_checkpoints: true
# Y = [accuracy in 0-1, -aa_cost in USD per evaluation]; the reference point must be dominated by all points:
# accuracy -0.1, cost -50 USD (worst case for 30 tasks). (The old 1.1 was for a different cost sign convention.)
reference_point:
  performance: -0.1
  cost: -50.0
